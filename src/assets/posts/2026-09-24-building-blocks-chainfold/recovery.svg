<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<style>
.n{fill:#0A0A0A;font-size:14px;font-weight:600}
.m{fill:#5A5347;font-size:11.5px}
.k{fill:#5A5347;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#0A0A0A"/>
  </marker>
</defs>

<text x="540" y="20" text-anchor="middle" class="k">one poll</text>

<!-- the header that no longer matches -->
<rect x="770" y="26" width="210" height="40" rx="6" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="875" y="51" text-anchor="middle" class="n">header from the node</text>
<path d="M876 66 L872 166" stroke="#0A0A0A" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="896" y="118" class="m">hash mismatch</text>

<!-- replay forward to the tip -->
<path d="M340 168 L340 132 L985 132 L985 166" fill="none" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="690" y="124" text-anchor="middle" class="m">replay</text>

<text x="434" y="146" text-anchor="middle" class="n">deepest canonical block</text>
<path d="M434 152 L434 168" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="653" y="146" text-anchor="middle" class="m">replaced blocks</text>

<!-- the observed ring -->
<g fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.4">
  <rect x="40"  y="170" width="58" height="44" rx="6"/>
  <rect x="113" y="170" width="58" height="44" rx="6"/>
  <rect x="186" y="170" width="58" height="44" rx="6"/>
  <rect x="259" y="170" width="58" height="44" rx="6"/>
  <rect x="332" y="170" width="58" height="44" rx="6" fill="#ECE8DA"/>
  <rect x="405" y="170" width="58" height="44" rx="6"/>
  <rect x="843" y="170" width="58" height="44" rx="6" fill="#ECE8DA"/>
</g>
<!-- blocks the reorg replaced -->
<g fill="#FBF9F1" stroke="rgba(10, 10, 10, 0.20)" stroke-width="1.4">
  <rect x="478" y="170" width="58" height="44" rx="6"/>
  <rect x="551" y="170" width="58" height="44" rx="6"/>
  <rect x="624" y="170" width="58" height="44" rx="6"/>
  <rect x="697" y="170" width="58" height="44" rx="6"/>
  <rect x="770" y="170" width="58" height="44" rx="6"/>
</g>

<!-- the tip the replay reaches -->
<rect x="950" y="170" width="70" height="44" rx="6" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="985" y="197" text-anchor="middle" class="n">tip</text>

<!-- checkpoints under every fourth block -->
<g fill="#0A0A0A">
  <rect x="63"  y="222" width="12" height="7"/>
  <rect x="355" y="222" width="12" height="7"/>
  <rect x="647" y="222" width="12" height="7"/>
</g>

<!-- rollback to the newest checkpoint at or below -->
<path d="M438 238 Q400 276 362 240" fill="none" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="448" y="268" class="m">rollback</text>

<text x="69"  y="248" text-anchor="middle" class="m">checkpoint</text>
<text x="653" y="248" text-anchor="middle" class="m">checkpoint</text>
<text x="872" y="248" text-anchor="middle" class="n">cursor block</text>
<text x="69"  y="263" text-anchor="middle" class="m">durable point</text>
<text x="361" y="300" text-anchor="middle" class="m">checkpoint</text>
<text x="361" y="315" text-anchor="middle" class="m">newest checkpoint at or below</text>

<!-- the span the driver bisects -->
<path d="M434 336 L434 344 L872 344 L872 336" fill="none" stroke="#0A0A0A" stroke-width="1.4"/>
<text x="653" y="366" text-anchor="middle" class="n">bisect the ring</text>

<line x1="20" y1="400" x2="1060" y2="400" stroke="#0A0A0A" stroke-opacity="0.12"/>
</svg>
