<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<style>
.n{fill:#0A0A0A;font-size:14px;font-weight:600}
.m{fill:#5A5347;font-size:11px}
.mono{fill:#5A5347;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.k{fill:#0A0A0A;font-size:15px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#0A0A0A"/>
  </marker>
</defs>

<!-- row 1: seal -->
<rect x="20" y="60" width="170" height="60" rx="8" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="105" y="95" text-anchor="middle" class="n">ephemeral</text>
<text x="105" y="111" text-anchor="middle" class="n">keypair</text>

<path d="M190 90 L235 90" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="212" y="80" text-anchor="middle" class="mono">ECDH</text>

<rect x="235" y="60" width="170" height="60" rx="8" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="320" y="95" text-anchor="middle" class="n">shared</text>
<text x="320" y="111" text-anchor="middle" class="n">secret</text>

<path d="M405 90 L450 90" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="450" y="60" width="170" height="60" rx="8" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="535" y="98" text-anchor="middle" class="k">HKDF</text>
<text x="535" y="136" text-anchor="middle" class="mono">key &#183; nonce &#183; commit</text>

<path d="M620 90 L665 90" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="665" y="60" width="170" height="60" rx="8" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="750" y="95" text-anchor="middle" class="n">AEAD</text>
<text x="750" y="111" text-anchor="middle" class="n">encrypt</text>

<path d="M835 90 L880 90" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="880" y="60" width="170" height="60" rx="8" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="965" y="95" text-anchor="middle" class="n">envelope</text>
<text x="965" y="136" text-anchor="middle" class="mono">epk &#183; commit &#183; ct</text>

<path d="M965 146 L965 200" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>

<!-- shared public list -->
<rect x="20" y="200" width="1040" height="60" rx="10" fill="#ECE8DA" stroke="#0A0A0A" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="540" y="228" text-anchor="middle" class="n">public list</text>
<text x="540" y="246" text-anchor="middle" class="m">every wallet reads the same list</text>

<path d="M100 260 L100 330" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>

<!-- row 2: open -->
<rect x="20" y="330" width="170" height="60" rx="8" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="105" y="365" text-anchor="middle" class="n">wallet's</text>
<text x="105" y="381" text-anchor="middle" class="n">secret key</text>

<path d="M190 360 L235 360" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="212" y="350" text-anchor="middle" class="mono">ECDH</text>

<rect x="235" y="330" width="170" height="60" rx="8" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="320" y="365" text-anchor="middle" class="n">shared</text>
<text x="320" y="381" text-anchor="middle" class="n">secret</text>

<path d="M405 360 L450 360" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="450" y="330" width="170" height="60" rx="8" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="535" y="368" text-anchor="middle" class="k">HKDF</text>
<text x="535" y="406" text-anchor="middle" class="mono">key &#183; nonce &#183; commit&#8217;</text>

<path d="M620 360 L706 360" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>

<circle cx="750" cy="360" r="44" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.6"/>
<text x="750" y="356" text-anchor="middle" class="mono">commit</text>
<text x="750" y="370" text-anchor="middle" class="mono">match?</text>

<path d="M786 336 L878 305" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M786 384 L878 415" stroke="#0A0A0A" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="880" y="278" width="170" height="54" rx="8" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="965" y="309" text-anchor="middle" class="n">skip</text>
<text x="965" y="323" text-anchor="middle" class="m">not mine</text>

<rect x="880" y="391" width="170" height="54" rx="8" fill="#FBF9F1" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="965" y="415" text-anchor="middle" class="n">decrypt</text>
<text x="965" y="429" text-anchor="middle" class="m">&#8594; note</text>

<line x1="20" y1="480" x2="1060" y2="480" stroke="#0A0A0A" stroke-opacity="0.12"/>
</svg>
